name: Android offline UI review

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ui-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-ui:
    name: API 34 / ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [compact-light, compact-dark-large]
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize evidence directory
        env:
          REVIEW_PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "app/build/reports/ui-review/$REVIEW_PROFILE"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('app/build/reports/ui-review') / os.environ['REVIEW_PROFILE']
          (path / 'job.json').write_text(json.dumps({
              'profile': os.environ['REVIEW_PROFILE'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'api': 34, 'target': 'default', 'arch': 'x86_64',
              'state': 'prepared; emulator and tests not yet verified'
          }, indent=2) + '\n')
          PY

      # 仅修改一次性 GitHub runner；不修改开发者电脑的虚拟化设置。
      - name: Enable KVM on ephemeral runner
        env:
          REVIEW_PROFILE: ${{ matrix.profile }}
        run: |
          set -euxo pipefail
          {
            uname -a
            id
            lscpu
            ls -l /dev/kvm || true
            if [ ! -e /dev/kvm ]; then
              sudo modprobe kvm
              case "$(lscpu)" in
                *GenuineIntel*) sudo modprobe kvm_intel ;;
                *AuthenticAMD*) sudo modprobe kvm_amd ;;
                *) echo 'Unsupported CPU vendor for KVM' >&2; exit 1 ;;
              esac
            fi
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
            sudo udevadm settle --timeout=15
            ls -l /dev/kvm
            test -c /dev/kvm
            sudo chmod 0666 /dev/kvm
            python3 - <<'PY'
          import fcntl
          import os

          fd = os.open('/dev/kvm', os.O_RDWR)
          try:
              api = fcntl.ioctl(fd, 0xAE00, 0)
              print(f'KVM API version: {api}', flush=True)
              if api != 12:
                  raise RuntimeError(f'Expected KVM API 12, got {api}')
          finally:
              os.close(fd)
          PY
          } 2>&1 | tee "app/build/reports/ui-review/$REVIEW_PROFILE/kvm-preflight.txt"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build both APKs and run unit tests
        timeout-minutes: 12
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace --no-daemon --max-workers=2 -Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8'

      - name: Run isolated emulator UI review
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          avd-name: ui-review
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          working-directory: android
          script: bash scripts/run-ui-review.sh ${{ matrix.profile }}

      - name: Upload actual screenshots, hierarchies, metadata and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-review-api34-${{ matrix.profile }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/app/build/reports/ui-review/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/

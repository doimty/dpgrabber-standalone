name: Android offline UI review

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ui-review.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ui-review-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-ui:
    name: API 34 / ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [compact-light, compact-dark-large]
    defaults:
      run:
        working-directory: android
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Initialize evidence directory
        env:
          REVIEW_PROFILE: ${{ matrix.profile }}
        run: |
          mkdir -p "app/build/reports/ui-review/$REVIEW_PROFILE"
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path('app/build/reports/ui-review') / os.environ['REVIEW_PROFILE']
          (path / 'job.json').write_text(json.dumps({
              'profile': os.environ['REVIEW_PROFILE'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'api': 34, 'target': 'default', 'arch': 'x86_64',
              'state': 'prepared; emulator and tests not yet verified'
          }, indent=2) + '\n')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Build both APKs and run unit tests
        timeout-minutes: 12
        run: bash ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest --stacktrace

      # 仅修改一次性 GitHub runner；不修改开发者电脑的虚拟化设置。
      - name: Enable KVM on ephemeral runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Run isolated emulator UI review
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          avd-name: ui-review
          force-avd-creation: true
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          disable-spellchecker: true
          enable-hw-keyboard: false
          working-directory: android
          script: bash scripts/run-ui-review.sh ${{ matrix.profile }}

      - name: Upload actual screenshots, hierarchies, metadata and JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-review-api34-${{ matrix.profile }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/app/build/reports/ui-review/
            android/app/build/reports/tests/testDebugUnitTest/
            android/app/build/test-results/testDebugUnitTest/

name: Build PC exe

on:
  push:
    branches: [main]
    paths:
      - 'pc/**'
      - '.github/workflows/build-pc.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r pc/requirements.txt
      - name: Run offline unit tests
        run: |
          cd pc
          python -m unittest discover -s tests
      - name: Write build stamp
        run: |
          python -c "import subprocess,pathlib; sha=subprocess.check_output(['git','rev-parse','--short','HEAD'],text=True).strip(); pathlib.Path('pc/build_stamp.py').write_text('SHA = \"%s\"\n' % sha, encoding='utf-8')"
          cat pc/build_stamp.py

      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DPGrabberPC pc/dpgrabber_pc.py
      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: DPGrabberPC-exe
          path: dist/DPGrabberPC.exe
          if-no-files-found: error
